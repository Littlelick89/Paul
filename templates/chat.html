<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교육 Q&A 시스템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a3c6e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.2rem; }
    header a  { color: #aed6f1; font-size: 0.85rem; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot  { justify-content: flex-start; }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: #1a3c6e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .bubble {
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    .sources {
      margin-top: 8px;
      font-size: 0.82rem;
    }
    .sources summary {
      cursor: pointer;
      color: #1a5276;
      user-select: none;
    }
    .sources summary:hover { text-decoration: underline; }
    .source-item {
      margin: 6px 0 0 12px;
      padding: 6px 10px;
      background: #eaf4fb;
      border-left: 3px solid #1a3c6e;
      border-radius: 4px;
      color: #333;
    }
    .source-item strong { color: #1a3c6e; }
    .snippet {
      margin-top: 4px;
      font-style: italic;
      color: #555;
      font-size: 0.80rem;
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px; height: 8px;
      background: #888;
      border-radius: 50%;
      margin: 0 2px;
      animation: blink 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1;   }
    }

    #input-area {
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #question-input {
      flex: 1;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }
    #question-input:focus { outline: none; border-color: #1a3c6e; }

    #send-btn {
      background: #1a3c6e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }
    #send-btn:hover    { background: #154360; }
    #send-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>교육 Q&amp;A 시스템</h1>
  <a href="/admin">문서 관리 (관리자)</a>
</header>

<div id="chat-window"></div>

<div id="input-area">
  <textarea
    id="question-input"
    rows="2"
    placeholder="질문을 입력하세요… (예: 레이저 교정 절차는 무엇인가요?)"
  ></textarea>
  <button id="send-btn" onclick="sendQuestion()">전송</button>
</div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const inputEl    = document.getElementById('question-input');
  const sendBtn    = document.getElementById('send-btn');

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  function appendMessage(role, html) {
    const row    = document.createElement('div');
    row.className = `msg-row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML  = html;
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  function renderSources(sources) {
    if (!sources || sources.length === 0) return '';
    const items = sources.map(s => `
      <div class="source-item">
        <strong>${escHtml(s.filename)}</strong> — p.${s.page}
        ${s.text_snippet ? `<div class="snippet">"${escHtml(s.text_snippet)}"</div>` : ''}
      </div>
    `).join('');
    return `
      <details class="sources">
        <summary>참고 문서 (${sources.length}개 청크)</summary>
        ${items}
      </details>
    `;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function sendQuestion() {
    const question = inputEl.value.trim();
    if (!question) return;

    appendMessage('user', escHtml(question));
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    const typingBubble = appendMessage('bot',
      '<div class="typing-indicator"><span></span><span></span><span></span></div>'
    );

    try {
      const res  = await fetch('/api/chat', {
        method:  'POST',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify({ question }),
      });
      const data = await res.json();

      typingBubble.innerHTML =
        escHtml(data.answer || data.error || '오류가 발생했습니다.')
          .replace(/\n/g, '<br>')
        + renderSources(data.sources);

    } catch (err) {
      typingBubble.innerHTML = '네트워크 오류가 발생했습니다. 서버 연결을 확인하세요.';
    } finally {
      sendBtn.disabled = false;
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
  }
</script>
</body>
</html>
